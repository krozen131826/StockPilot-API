
services:
  postgres:
    image: postgres:17
    container_name: stockpilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - stockpilot-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: stockpilot-api:latest
    container_name: stockpilot-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      ConnectionStrings__IdentityConnection: "Host=postgres;Port=5432;Database=StockPilotIdentity;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      JwtSettings__Issuer: "${JWT_ISSUER}"
      JwtSettings__Audience: "${JWT_AUDIENCE}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__ExpirationInDays: "${JWT_EXPIRATION_DAYS}"

      Identity__AdminUsername: "${IDENTITY_ADMIN_USERNAME}"
      Identity__AdminEmail: "${IDENTITY_ADMIN_EMAIL}"
      Identity__AdminPassword: "${IDENTITY_ADMIN_PASSWORD}"

volumes:
  stockpilot-postgres-data:
