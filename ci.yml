
name: StockPilot CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore StockpilotApi.slnx

      - name: Build solution
        run: dotnet build StockpilotApi.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test StockpilotApi.slnx --configuration Release --no-build
